AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repository for the Mini Kanban image (created first so we can push before the app stack).

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mini-kanban
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Description: Use this as the docker tag / ImageUri for the app stack
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: mini-kanban-ecr-uri
  RepositoryName:
    Value: !Ref Repository
