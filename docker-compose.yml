services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sdip
      POSTGRES_PASSWORD: sdip
      POSTGRES_DB: sdip
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdip -d sdip"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    image: ${APP_IMAGE:-mini-kanban}
    build: .
    ports:
      - "${APP_PORT:-8091}:8091"
    environment:
      SDIP_DATABASE_URL: postgresql://sdip:sdip@postgres:5432/sdip
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
