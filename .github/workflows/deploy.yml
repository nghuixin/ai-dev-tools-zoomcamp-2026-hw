name: Deploy

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '577331852018' }}
  ECR_STACK: mini-kanban-ecr
  APP_STACK: mini-kanban-app

jobs:
  aws:
    name: CloudFormation + health check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - id: role
        name: Resolve IAM role ARN
        env:
          RAW_ROLE: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          role="$(printf '%s' "$RAW_ROLE" | tr -d '[:space:]' | tr -d '"')"
          if [ -z "$role" ]; then
            echo "Set GitHub variable AWS_ROLE_ARN to the full role ARN from the OIDC stack."
            echo "Example: arn:aws:iam::${AWS_ACCOUNT_ID}:role/mini-kanban-github-actions"
            echo "If this job uses the production environment, set the variable there too."
            exit 1
          fi
          if [[ "$role" != arn:aws:iam::* ]]; then
            echo "AWS_ROLE_ARN is a role name, not an ARN. Building ARN from AWS_ACCOUNT_ID."
            role="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${role#role/}"
          fi
          echo "Using $role"
          echo "arn=$role" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR stack
        run: |
          aws cloudformation deploy \
            --stack-name "$ECR_STACK" \
            --template-file infra/ecr.yml \
            --no-fail-on-empty-changeset

      - id: ecr
        name: Login and image URI
        run: |
          uri=$(aws cloudformation describe-stacks \
            --stack-name "$ECR_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" \
            --output text)
          echo "uri=$uri" >> "$GITHUB_OUTPUT"
          echo "image=${uri}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${uri%%/*}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.image }}
            ${{ steps.ecr.outputs.uri }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: App stack
        run: |
          aws cloudformation deploy \
            --stack-name "$APP_STACK" \
            --template-file infra/app.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides "ImageUri=${{ steps.ecr.outputs.image }}" \
            --no-fail-on-empty-changeset

      - id: url
        name: App URL
        run: |
          url=$(aws cloudformation describe-stacks \
            --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" \
            --output text)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed URL: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate /health
        run: |
          url="${{ steps.url.outputs.url }}"
          for i in $(seq 1 60); do
            if curl -fsS "$url/health" | grep -q '"status":"ok"'; then
              echo "Health check passed: $url/health"
              exit 0
            fi
            echo "waiting ($i)..."
            sleep 10
          done
          echo "Health check failed for $url/health"
          exit 1
